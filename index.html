<!DOCTYPE html>
<html lang="pl">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta charset="utf-8">
  <title>LatinoDancePasion – Salsa & Bachata Kochcice</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
        content="LatinoDancePasion – szkoła tańca w Kochcicach. Salsa i bachata z prawdziwej pasji do latynoskich rytmów i emocji. Sprawdź kontakt i dołącz do nas.">
  <meta name="theme-color" content="#050816">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">

  <style>
    /* NOWE STYLE DLA RAMEK - BŁĘKIT I CIENIE */
    .contact-item {
      display: flex;
      align-items: center;
      background-color: #ffffff !important;
      border: 2px solid #e0f2fe !important; /* Jasny błękitny brzeg */
      border-radius: 18px !important;
      margin-bottom: 20px !important;
      padding: 15px !important;
      text-decoration: none !important;
      transition: all 0.3s ease !important;
      box-shadow: 0 6px 15px rgba(186, 230, 253, 0.5) !important; /* Błękitny cień */
    }

    /* Efekt po dotknięciu/najechaniu */
    .contact-item:active, .contact-item:hover {
      border-color: #bae6fd !important;
      transform: scale(1.01);
      box-shadow: 0 8px 20px rgba(186, 230, 253, 0.7) !important;
    }

    /* POPRAWKI DLA SMARTFONÓW */
    @media (max-width: 600px) {
      .contact-item {
        flex-direction: column !important;
        text-align: center !important;
        padding: 25px 15px !important;
        height: auto !important;
      }
      .contact-text {
        margin: 10px 0 !important;
      }
      .contact-value {
        white-space: nowrap !important;
        display: block !important;
        font-size: 1.2rem !important;
        margin: 5px 0 15px 0 !important;
        color: #333 !important;
      }
      .button-ghost {
        position: relative !important;
        display: inline-block !important;
        width: 100% !important;
        padding: 12px !important;
        border: 1px solid #bae6fd !important;
        border-radius: 10px !important;
        background: #f0f9ff !important;
        color: #0369a1 !important;
        font-weight: 600 !important;
      }
      .contact-icon {
        margin-bottom: 10px !important;
        background: #f0f9ff !important;
        padding: 8px !important;
        border-radius: 12px !important;
      }
      .contact-item--map .contact-value {
        white-space: normal !important;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <main class="card">

      <header class="hero" aria-label="LatinoDancePasion – szkoła tańca">
        <figure class="hero__banner">
          <img src="images/hero-latinodancepasion.jpg" alt="Para tańcząca latynoską salsę" loading="lazy">
        </figure>
        <p class="hero-line">
          Uczymy się <span>salsy i bachaty</span> z prawdziwej pasji do latynoskich rytmów i emocji.
        </p>
      </header>

      <section class="contact" aria-label="Dane kontaktowe">
        <!-- Telefon -->
        <a class="contact-item" href="tel:+48889906765">
          <img src="images/icons/phone.svg" class="contact-icon" alt="" aria-hidden="true">
          <div class="contact-text">
            <h2 class="contact-label">Telefon</h2>
            <p class="contact-value">889 906 765</p>
          </div>
        </a>

        <!-- Adres -->
        <a class="contact-item contact-item--map" 
           href="https://maps.google.com/?q=ul.+Ogrodowa+5,+Kochcice" 
           target="_blank" rel="noopener">
          <img src="images/icons/location.svg" class="contact-icon" alt="" aria-hidden="true">
          <div class="contact-text">
            <h2 class="contact-label">Adres</h2>
            <p class="contact-value">ul. Ogrodowa 5, Kochcice</p>
          </div>
          <span class="button-ghost">Nawiguj</span>
        </a>

        <!-- Instagram -->
        <a class="contact-item contact-item--instagram"
           href="https://www.instagram.com/latinodancepasion/"
           target="_blank" rel="noopener">
          <img src="images/icons/instagram.svg" class="contact-icon" alt="" aria-hidden="true">
          <div class="contact-text">
            <h2 class="contact-label">Instagram</h2>
            <p class="contact-value">@latinodancepasion</p>
          </div>
          <span class="button-ghost">Odwiedź Instagram</span>
        </a>
      </section>

      <footer class="footer">
        <p class="footer__text">© 2025 LatinoDancePasion. Wszelkie prawa zastrzeżone.</p>
      </footer>
    </main>
  </div>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LocalBusiness",
    "name": "LatinoDancePasion",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "ul. Ogrodowa 5",
      "addressLocality": "Kochcice",
      "addressCountry": "PL"
    },
    "telephone": "+48 889 906 765",
    "sameAs": [ "https://www.instagram.com/latinodancepasion/" ]
  }
  </script>
</body>
</html>
