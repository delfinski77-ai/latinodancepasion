  <style>
    /* EKSTREMALNIE WYRAŹNE RAMKI I EFEKT 3D */
    .contact-item {
      display: flex;
      align-items: center;
      background-color: #ffffff !important;
      
      /* Super gruba ramka - 8 pikseli */
      border: 8px solid #0ea5e9 !important; 
      border-radius: 30px !important;
      
      margin-bottom: 35px !important;
      padding: 25px !important;
      text-decoration: none !important;
      transition: all 0.2s ease-in-out !important;
      
      /* Bardzo mocny, szeroki błękitny cień widoczny z daleka */
      box-shadow: 0 15px 35px rgba(14, 165, 233, 0.4) !important;
      position: relative;
    }

    /* Efekt po dotknięciu/najechaniu - karta mocno reaguje */
    .contact-item:active, .contact-item:hover {
      border-color: #0369a1 !important; /* Ciemnieje przy kliku */
      transform: scale(1.03) translateY(-5px); /* Powiększa się i unosi */
      box-shadow: 0 20px 45px rgba(3, 105, 161, 0.6) !important;
    }

    /* Wyraźne nagłówki wewnątrz ramek */
    .contact-label {
      color: #0369a1 !important;
      font-weight: 900 !important;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* POPRAWKI DLA SMARTFONÓW - MAKSYMALNA CZYTELNOŚĆ */
    @media (max-width: 600px) {
      .contact-item {
        flex-direction: column !important;
        text-align: center !important;
        padding: 40px 20px !important;
        margin-left: 10px !important;
        margin-right: 10px !important;
      }
      .contact-text {
        margin: 20px 0 !important;
      }
      .contact-value {
        white-space: nowrap !important;
        display: block !important;
        font-size: 1.8rem !important; /* Bardzo duży tekst */
        font-weight: 900 !important;
        margin: 10px 0 25px 0 !important;
        color: #0ea5e9 !important;
      }
      .button-ghost {
        position: relative !important;
        display: block !important;
        width: 100% !important;
        padding: 20px !important;
        border: none !important;
        border-radius: 15px !important;
        background: #0ea5e9 !important; /* Mocny błękitny przycisk */
        color: #ffffff !important;      /* Biały tekst */
        font-weight: 900 !important;
        font-size: 1.1rem !important;
        text-transform: uppercase !important;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2) !important;
      }
      .contact-icon {
        width: 60px !important;
        height: 60px !important;
        margin-bottom: 15px !important;
        background: #f0f9ff !important;
        padding: 10px !important;
        border: 4px solid #0ea5e9 !important;
        border-radius: 20px !important;
      }
      .contact-item--map .contact-value {
        white-space: normal !important;
        font-size: 1.5rem !important;
      }
    }
  </style>
